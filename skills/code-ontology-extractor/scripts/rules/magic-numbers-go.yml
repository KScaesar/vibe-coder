id: magic-number-go
language: go
severity: hint
message: >-
  Numeric constant. Someone decided this value; the code does not record why.
  Apply the constant matrix in SKILL.md before recording it as a business rule.
rule:
  any:
    - kind: float_literal
    - kind: int_literal
  not:
    # Comparison, indexing and power-of-two sizing boilerplate.
    # Business constants are rarely 0, 1 or 2, and a buffer size is not a
    # decision anyone made about the domain — the power-of-two list runs to
    # 65536 because that is where buffer and page sizing actually lives.
    regex: '^(0|1|2|-1|0\.0|1\.0|100|1000|4|8|16|32|64|128|256|512|1024|2048|4096|8192|16384|32768|65536)$'
