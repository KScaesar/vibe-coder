# The exclusion list is the whole rule: a detector that fires on every 0 and 1
# buries the one constant that encodes a business decision.
id: magic-number-go
valid:
  - "x := 0"
  - "x := 1"
  - "x := 2"
  - "x := 100"
  - "x := 1000"
  - "x := 1024"
  - "x := 0.0"
  - "x := 1.0"
  - "buf := make([]byte, 4096)"
invalid:
  - "coolOffDays := 7"
  - "discount := 0.85"
  - "maxLoan := 50000"
  # A suspiciously precise technical constant. SKILL.md wants it surfaced so
  # the reader can decide whether it is a measurement or an obligation.
  - "timeout := 2700 * time.Millisecond"
