# =============================================================================
# Domain Ontology Schema Specification
#
# 定義：依據知識工程（Knowledge Engineering）經典定義（Studer et al., 1998; Gruber, 1993），
# 本體論（Ontology）是「對共享概念化模型的形式化、明確規範」
# （A formal, explicit specification of a shared conceptualization）。
#
# -----------------------------------------------------------------------------
# 核心任務：解決 DDD 跨限界上下文（Bounded Contexts）的語意對齊與邏輯推理
#
# DDD 的常態是「上下文隔離（Context Autonomy）」：
# - 同一個業務概念在不同模組可能有名稱差異（同義異名，如 Billing 叫 PayerAccount、CRM 叫 Client、Ad 叫 Advertiser）。
# - 同一個名稱在不同模組可能有完全不同的語意與模型（異義同名，如 Order 在銷售與倉儲模組代表不同事物）。
#
# 本體論的核心價值在於提供「可邏輯推理的共享語意錨點（Shared Semantic Anchor）」：
# 1. 概念等價與對齊（Semantic Equivalence & Context Mappings）：
#    - 透過 `concepts[].context_mappings` 與 `vocabulary[].aliases` 分析出「不同名稱但同本質概念」，
#      建立可跨模組推理的語意對齊圖譜。
# 2. 概念階層與上下位推論（Subsumption / `sub_class_of`）：
#    - 支援繼承與泛化推理（如 SpecialAdRequest sub_class_of AdRequest）。
# 3. 概念互斥性檢驗（Disjointness / `disjoint_with`）：
#    - 在開放世界假設（OWA）下，明確標記異義同名或本質衝突的概念不可重疊。
# 4. 關係代數推理（Relational Reasoning / `inverse_of`, `characteristics`）：
#    - 支援反向關係推導（`places` <-> `placed_by`）與傳遞性/函數性推理。
# 5. 世界事實與因果推理（World Events）：
#    - 記錄世界中發生的客觀事件（誰、作用對象、何時、因果），用於因果推斷與全局查詢。
#
# 檔名規範: <system.name>.ontology.yml
# =============================================================================

# -----------------------------------------------------------------------------
# provenance 共同結構（來源追溯）
# -----------------------------------------------------------------------------
# vocabulary / concepts / events / workflows / axioms / open_questions 共用此結構。
#
# provenance:
#   - type: enum
#     #   code | sql | document | ticket | meeting_note | dashboard | other
#     #   type=other 時必填 location.description；反覆出現之同類別應擴充 enum。
#
#     location: object
#     #   type=code:         { file, symbol, lines(optional) }
#     #   type=sql:          { file_or_query_name, lines(optional) }
#     #   type=document:     { url_or_file, section(optional) }
#     #   type=ticket:       { system, id, url(optional) }
#     #   type=meeting_note: { date, reference(optional) }
#     #   type=dashboard:    { url, panel(optional) }
#     #   type=other:        { description, reference(optional) }
#
#     evidence_type: enum
#     #   lsp | tree-sitter | ast-grep | text-scan | comment | human
#     #   記錄證據類型與提取工具。填寫優先序: human > comment > 實際工具。
#     #   純記錄來源事實，不參與 confidence 之數學運算。
#
#     note: string   # 補充說明，可留空
#
# -----------------------------------------------------------------------------
# review 共同結構（複核狀態）
# -----------------------------------------------------------------------------
# vocabulary / concepts / events / workflows / axioms 共用複核欄位。
#
#   confidence: float
#   #   語意確定性評分（0.0 ~ 1.0），錨定客觀證據等級（見 SKILL.md）。
#   #   低於 0.5 必須在 open_questions 中建立對應條目。
#
#   human_verified: bool
#   #   是否經領域專家或工程師人工驗證。初始一律為 false。
#
#   human_note: string
#   #   人工補充或修正說明。請保留原始推論內容，勿直接覆蓋。
# -----------------------------------------------------------------------------

system:
  # 本體論所屬系統識別碼。預期值: kebab-case，例如 "ssai-ad-decision"
  name: string

  # 業務領域分類標籤。預期值: kebab-case，例如 "advertising"、"e-commerce"
  domain: string

  # 系統核心業務本質與範圍說明（1~3 句話，以領域語言撰寫）。
  description: string

  # 本體論規格版本。預期值: "1.0"、"1.1"
  version: string

  # 抽取時錨定之 Git Commit SHA（用於確保代碼符號座標之可溯性）。
  commit_sha: string

  # 本體論產生或最後更新時間戳記。預期值: ISO 8601，例如 "2026-08-28T10:00:00Z"
  generated_at: timestamp

  # 知識層複核狀態:
  #   draft          = 初稿，由 AI 自動抽取完成
  #   human_reviewed = 已由軟體工程師核對代碼與符號結構
  #   verified       = 已由領域專家（Domain Expert）確認業務語意無誤
  review_status: enum

  # 領域專屬停用詞覆寫。防止通用基礎設施停用詞誤殺領域關鍵概念（如廣告領域之 ad_request）。
  vocabulary_overrides:
    force_domain: [string]      # 強制納入領域概念（取消停用詞降權）
    force_technical: [string]   # 強制視為技術實作產物（額外降權排除）


# -----------------------------------------------------------------------------
# vocabulary — 受治理的詞彙表（Governed Vocabulary / Lexicon）。
# 語意對齊核心：記錄代碼中同義異名（Aliases）與跨限界上下文的語意分歧（Conflict Notes）。
# -----------------------------------------------------------------------------
vocabulary:
  - term: string
    # 規範性術語名稱。

    definition: string
    # 術語的精確業務定義（以完整陳述句表達，嚴禁僅做同義詞替換）。

    aliases: [string]
    # 代碼中實際使用的同義詞、縮寫或別名清單（解決跨上下文之同義異名）。

    provenance: [provenance_object]

    conflict_notes: string
    # 語意分歧與衝突記錄（例如同名術語在不同上下文代表不同概念）。
    # 嚴禁隨意挑選單一標準抹平分歧——分歧本身即是領域邊界的重要發現。

    confidence: float
    human_verified: bool
    human_note: string


# -----------------------------------------------------------------------------
# concepts — 領域概念與類別（Concepts / Classes / TBox）。
# 代表領域中的一等概念。具備階層繼承（sub_class_of）、互斥公理（disjoint_with）
# 與跨限界上下文映射（context_mappings），支援「不同名字但同一意義」之邏輯推理。
# -----------------------------------------------------------------------------
concepts:
  - id: string
    # 穩定概念識別碼（snake_case），供 relations / workflows / axioms / events 引用。

    name: string
    # 概念的人類可讀標籤（Human-readable label）。

    description: string
    # 概念的本質定義與語意範疇（1~2 句話，專注業務本質，不描述實作細節）。

    # 上位概念識別碼（Taxonomy / SubClassOf），支援邏輯繼承與演繹推論。可省略。
    sub_class_of: string

    # 互斥概念 ID 清單（DisjointClasses），在 OWA 下宣告不可同時成立之概念。可省略。
    disjoint_with: [concept_id]

    # 跨限界上下文映射：分析並記錄此本質概念在不同業務子領域/限界上下文中的名稱與代碼符號（同義異名對齊）
    # 注意：只填寫業務限界上下文（如 "billing", "crm", "settlement", "ad_decision"）；嚴禁填入技術分層（"api", "storage", "dto"）
    context_mappings:
      - context: string       # 業務限界上下文名稱（例如 "billing", "crm", "ad_decision"）
        local_name: string    # 該上下文中的本機領域名稱（例如 "PayerAccount", "Client", "PlacementRequest"）
        symbol: string        # 代碼對應符號（例如 "internal/domain/billing.Account"）

    properties:
      - name: string
        # 數據屬性名稱（Data Property）。

        description: string
        # 數據屬性的業務語意與取值意涵（嚴禁填入 varchar, bigint 等實體儲存型別）。

    provenance: [provenance_object]

    confidence: float
    human_verified: bool
    human_note: string


# -----------------------------------------------------------------------------
# events — 世界事實與事件型態（World Events / Occurrences）。
# 描述領域中在特定時間或時段發生過的客觀事實。
# 核心重點：關注參與者（participants）、作用對象（target）、時間特性與因果關係，
# 用於跨系統知識圖譜構建、因果分析與時間軸查詢（回答「世界裡發生了什麼」）。
# -----------------------------------------------------------------------------
events:
  - id: string
    # 事件型態識別碼（snake_case，例如 "ad_impression", "conversion_recorded", "order_placed"）。

    name: string
    # 事件顯示名稱。

    description: string
    # 描述世界中發生了什麼客觀事實。

    participants: [concept_id]
    # 參與該事件的核心主體/概念（引用 concepts[].id，如 [user, advertiser]）。

    target: concept_id
    # 受事件作用或影響的目標資產/概念（引用 concepts[].id，如 ad_creative, order）。

    properties:
      - name: string
        # 事件發生時所捕捉的度量或數據特徵（如 bid_price, latency_ms, settlement_amount）。
        description: string

    provenance: [provenance_object]

    confidence: float
    human_verified: bool
    human_note: string


# -----------------------------------------------------------------------------
# workflows — 業務流程與運作過程（Workflows & Operational Processes）。
# 描述領域中因果相扣的巨觀運作流程與狀態推進，回答「業務如何運轉」。
# -----------------------------------------------------------------------------
workflows:
  - id: string
    # 流程識別碼（snake_case）。

    name: string
    # 流程名稱。

    trigger: string
    # 啟動該流程的業務事件或前置條件（以領域事件語言描述）。

    steps:
      - description: string
        # 步驟的業務行為說明。
        provenance: [provenance_object]

    # 流程之輸入與輸出概念 ID 清單（必須存在於 concepts[].id 或 events[].id）
    inputs: [concept_id]
    outputs: [concept_id]

    confidence: float
    human_verified: bool
    human_note: string


# -----------------------------------------------------------------------------
# axioms — 業務約束與公理（Axioms & Domain Constraints）。
# 記錄領域內必然成立的公理性規則：基數約束（Cardinality）、可選性（Optionality）、
# 有效性條件（Validity conditions）、分類公理（Classification rules）與存取政策。
# -----------------------------------------------------------------------------
axioms:
  - id: string
    # 公理/約束識別碼（snake_case）。

    description: string
    # 業務約束或公理的完整敘述。

    condition: string
    # 觸發或適用的業務前置條件（例如「使用者對同一廣告素材之曝光次數達上限」）。

    action: string
    # 條件成立時所強制執行的約束後果或狀態轉變（例如「將該素材自候選集合中剔除」）。

    provenance: [provenance_object]

    confidence: float
    human_verified: bool
    human_note: string


# -----------------------------------------------------------------------------
# relations — 聲明對象關係（Declared Object Properties / Relations）。
# 採開放式語意三元組（Subject - Predicate - Object），支援反向關係（inverse_of）
# 與代數特徵（characteristics），使機器可自動進行關係導向的邏輯推論。
# -----------------------------------------------------------------------------
relations:
  - subject: string
    # 主體概念 ID（引用 concepts[].id、events[].id、workflows[].id 或 axioms[].id）。
    # 若為外部系統或跨領域概念，需於 description 中明確說明。

    predicate: string
    # 業務語意動詞謂詞。例如:
    #   "places" (Customer places Order), "settles", "contains", "depends_on", "implemented_by"
    # implemented_by 用於將業務概念錨定至實作之服務/函數（代碼座標記入 provenance）。

    object: string
    # 客體概念 ID（引用來源同 subject）。

    # 反向關係謂詞名稱（例如 "places" 的反向是 "placed_by"），支援自動雙向推論。可留空。
    inverse_of: string

    # 關係之代數特徵（支援 transitive, symmetric, functional, inverse_functional）。可留空。
    characteristics: [enum]

    description: string
    # 關係的語意意圖與業務關聯說明。

    provenance: [provenance_object]


# -----------------------------------------------------------------------------
# open_questions — 認識論缺口與待決問題（Epistemic Gaps & Ambiguities）。
# 在開放世界假設（OWA）下，明確標記代碼未載明之未知項、低信心推論與未決爭議。
# -----------------------------------------------------------------------------
open_questions:
  - id: string
    # 待決問題識別碼（snake_case，例如 "q_attribution_model_window"）。

    question: string
    # 具體待澄清之領域語意問題。

    related_to: [concept_id | axiom_id | event_id]
    # 關聯的概念、公理或事件 ID 清單。

    provenance: [provenance_object]

    severity: enum
    # 優先級分級:
    #   P0 = 阻斷型（Blocking）：核心概念或關係語意不明，本體模型無法成立。
    #   P1 = 可假設型（Assumable）：具合理業務預設推論，需專家確認後生效。
    #   P2 = 邊緣型（Marginal）：歷史遺留常數或邊緣防禦邏輯，不影響主要領域理解。

    proposed_default: string
    # AI 建議之預設答案與推論理由（減輕專家從零撰寫負擔；未經確認前嚴禁填入正式內容）。
